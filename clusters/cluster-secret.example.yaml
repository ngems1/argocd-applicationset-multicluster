# How a workload cluster is registered in Argo CD (a Secret in the argocd namespace of the
# management cluster). tests/e2e/run.sh builds the real ones for the kind clusters.
# NEVER commit a real one: it contains a credential. Deliver it with External Secrets or
# Sealed Secrets (THREAT-MODEL T2).
apiVersion: v1
kind: Secret
metadata:
  name: cluster-prod-eu-west-1
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    # The ApplicationSet selects clusters by this label, and it picks the overlay.
    code-clinic.io/env: prod
    code-clinic.io/region: eu-west-1
type: Opaque
stringData:
  name: prod-eu-west-1
  server: https://prod-eu-west-1.example.internal:6443
  # Namespace-scoped mode: Argo CD only watches, and can only manage, these namespaces.
  namespaces: podinfo
  clusterResources: "false"
  config: |
    {
      "bearerToken": "<token of argocd-manager, from your secret store>",
      "tlsClientConfig": {
        "insecure": false,
        "caData": "<base64 CA bundle of the cluster>"
      }
    }
