[project]
name = "argocd-applicationset-multicluster"
version = "1.0.0"
description = "Tests for the Argo CD ApplicationSet + Kustomize/Helm multi-cluster pattern"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.19",
  "pytest>=8.4",
  "pyyaml>=6.0.2",
  "ruff>=0.17",
  "types-pyyaml>=6.0.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT"]
ignore = ["S603", "S607"] # tests call kustomize with fixed argument lists

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
